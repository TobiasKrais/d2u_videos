package: d2u_videos
version: '1.3.3'
author: Tobias Krais
supportpage: http://github.com/tobiaskrais/d2u_videos

page:
    title: 'translate:d2u_videos'
    perm: 'd2u_videos[]'
    icon: rex-icon fa-video-camera
    subpages:
        videos: { title: 'translate:d2u_videos_videos', icon: rex-icon fa-video-camera }
        playlist: { title: 'translate:d2u_videos_playlists', icon: rex-icon fa-list-ol, perm: 'd2u_videos[edit_data]' }
        settings:
            icon: rex-icon rex-icon-system
            title: ''
            itemClass: pull-right
            subpages:
                settings: { title: 'translate:d2u_helper_settings', icon: rex-icon rex-icon-system, perm: 'd2u_videos[settings]' }
                setup: { title: 'translate:d2u_helper_setup', icon: rex-icon rex-icon-install, perm: 'd2u_videos[settings]' }
        help:
            title: ''
            icon: rex-icon rex-icon-help
            itemClass: pull-right
            subpages:
                changelog: { title: 'translate:d2u_helper_help_chapter_changelog' }

requires:
    packages:
        d2u_helper: '>=2.2.2'
    php: '>=8.0'
    redaxo: '>=5.10.0'

default_config:
    max_height: '440'
    max_width: '1180'
    additional_video_usage_tables: ''

installer_ignore:
    - .github